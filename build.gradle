// ☭ Red Star Client — Root Build Script
plugins {
    id 'java'
    id 'fabric-loom' version "${loomVersion}" apply false
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(Integer.parseInt(javaVersion as String))
        }
    }

    version = project.modVersion
    group = project.modGroup

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
        }
        maven {
            name = 'JitPack'
            url = 'https://jitpack.io'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = Integer.parseInt(project.javaVersion as String)
    }
}
