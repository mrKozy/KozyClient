plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

repositories {
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    accessWidenerPath = file("src/main/resources/redstarclient.accesswidener")

    mods {
        "redstarclient" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // ImGui Java bindings
    include(implementation("io.github.spair:imgui-java-binding:${imguiJavaVersion}"))
    include(implementation("io.github.spair:imgui-java-lwjgl3:${imguiJavaVersion}"))
    include(implementation("io.github.spair:imgui-java-natives-windows:${imguiJavaVersion}"))

    // Gson
    include(implementation("com.google.code.gson:gson:2.11.0"))
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    manifest {
        attributes([
            "Implementation-Title"  : "Red Star Client",
            "Implementation-Version": project.version,
        ])
    }
    archiveBaseName = "fabric"
    archiveVersion = project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
